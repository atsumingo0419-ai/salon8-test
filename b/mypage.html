<!doctype html>
<!-- B案の mypage.html。tools/make_b_pages.py で A案（site/mypage.html）から作ったもの。直すときは A案を直して作り直す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約の確認｜脱毛salon8（はち）</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F3EC">
<link rel="icon" href="favicon-b.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=6">

</head>
<body class="r-body theme-b">

  <symbol id="bee" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55.5 28.5 C53 19 47 13.5 40.5 12.5"/><circle cx="38.6" cy="12.2" r="2"/>
    <path d="M64.5 28.5 C67 19 73 13.5 79.5 12.5"/><circle cx="81.4" cy="12.2" r="2"/>
    <circle cx="60" cy="39" r="10.5"/>
    <circle cx="60" cy="65" r="15.5"/>

    <path d="M56 80 L60 88 L64 80"/>

<div class="proto-bar" id="demo-bar" hidden>デモモード：仮のデータです。変更・キャンセルしても実際には送られません。</div>

<header class="site-header r-header">
  <div class="wrap">
    <a class="logo-b" href="index.html" aria-label="脱毛salon8（はち） HPへ">
      <svg class="bee" viewBox="0 0 120 100" style="stroke-width:3"><use href="#bee"/></svg>
      <span class="logo-b-txt"><span class="ja">脱毛salon8</span><small>My Reservation</small></span>
    </a>
    <a class="r-home" href="index.html">HPを見る</a>
  </div>
</header>

<main class="r-main">
  <h1 class="r-title" style="margin-top:20px">ご予約の確認</h1>
  <p class="r-sub" id="sub">これからのご予約です。日時の変更・キャンセルができます。</p>
  <p class="line-chip" id="line-chip" style="margin:14px 0 0" hidden></p>

  <p class="loading-line" id="boot">読み込み中…</p>
  <div class="alert" id="error" hidden></div>
  <p class="notice" id="notice" hidden></p>

  <div class="bk-list" id="list"></div>
  <div class="empty" id="empty" hidden>これからのご予約はありません。</div>

  <div class="r-actions">
    <a class="btn btn-primary" id="new" href="reserve.html?from=line">新しく予約する</a>
    <a class="btn btn-line" id="talk" href="https://lin.ee/BdPU7Iq">トークで相談する</a>
  </div>
  <p class="r-note" id="note"></p>

  <section class="hist" id="hist" hidden>
    <h2 class="hist-title">これまでのご予約</h2>
    <ul class="hist-list" id="hist-list"></ul>
  </section>
</main>

<!-- キャンセルの確認 -->
<dialog class="sheet" id="cancel-dialog" aria-labelledby="cancel-title">
  <div class="sheet-head">
    <strong id="cancel-title">このご予約をキャンセルしますか？</strong>
    <button type="button" class="sheet-close" data-close aria-label="閉じる">×</button>
  </div>
  <div class="sheet-body" id="cancel-body"></div>
  <div class="sheet-foot">
    <div class="r-actions" style="margin-top:0">
      <button type="button" class="btn btn-danger" id="cancel-ok">キャンセルする</button>
      <button type="button" class="btn btn-ghost" data-close>やめる</button>
    </div>
  </div>
</dialog>

<script src="../js/config.js?v=4"></script>
<script src="../js/data.js?v=4"></script>
<script src="../js/api.js?v=5"></script>
<script src="../js/line.js?v=3"></script>
<script src="../js/mypage.js?v=3"></script>
</body>
</html>
