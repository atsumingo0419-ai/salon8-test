<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約の確認｜脱毛salon8（はち）</title>

<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="r-body">

<div class="proto-bar" id="demo-bar" hidden>デモモード：仮のデータです。変更・キャンセルしても実際には送られません。</div>

<header class="site-header r-header">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="脱毛salon8（はち） HPへ">
      <span class="logo-8">8</span>
      <span class="logo-txt"><small>DATSUMOU SALON</small><span>ご予約の確認</span></span>
    </a>
    <a class="r-home" href="index.html">HPを見る</a>
  </div>
</header>

<main class="r-main">
  <h1 class="r-title" style="margin-top:20px">ご予約の確認</h1>
  <p class="r-sub" id="sub">これからのご予約です。日時の変更・キャンセルができます。</p>
  <p class="line-chip" id="line-chip" style="margin:14px 0 0" hidden></p>

  <p class="loading-line" id="boot">読み込み中…</p>
  <div class="alert" id="error" hidden></div>
  <p class="notice" id="notice" hidden></p>

  <div class="bk-list" id="list"></div>
  <div class="empty" id="empty" hidden>これからのご予約はありません。</div>

  <div class="r-actions">
    <a class="btn btn-primary" id="new" href="reserve.html?from=line">新しく予約する</a>
    <a class="btn btn-line" id="talk" href="https://lin.ee/BdPU7Iq">トークで相談する</a>
  </div>
  <p class="r-note" id="note"></p>
</main>

<!-- キャンセルの確認 -->
<dialog class="sheet" id="cancel-dialog" aria-labelledby="cancel-title">
  <div class="sheet-head">
    <strong id="cancel-title">このご予約をキャンセルしますか？</strong>
    <button type="button" class="sheet-close" data-close aria-label="閉じる">×</button>
  </div>
  <div class="sheet-body" id="cancel-body"></div>
  <div class="sheet-foot">
    <div class="r-actions" style="margin-top:0">
      <button type="button" class="btn btn-danger" id="cancel-ok">キャンセルする</button>
      <button type="button" class="btn btn-ghost" data-close>やめる</button>
    </div>
  </div>
</dialog>

</body>
</html>
